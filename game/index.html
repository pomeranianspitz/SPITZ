<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPITZ RUN — THE PACK IS FORMING.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none}.wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}.game{width:min(900px,100%);height:min(700px,calc(100vh - 28px));position:relative;border:2px solid #f5b900;border-radius:24px;overflow:hidden;background:#080808}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:14px 16px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-weight:900;z-index:2}.box{background:#080808dd;border:1px solid #b6ff00;border-radius:12px;padding:8px 12px;color:#b6ff00}.title{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#f5b900;font-weight:1000;letter-spacing:.12em;font-size:clamp(16px,3vw,24px);white-space:nowrap;z-index:2}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000b;z-index:4}.panel{padding:28px;border:1px solid #f5b900;border-radius:22px;background:#0b0b0bf5;max-width:430px;margin:18px}.panel h1{margin:0 0 8px;color:#f5b900;font-size:clamp(34px,8vw,58px);line-height:1}.panel p{color:#ccc}.btn{border:0;border-radius:12px;background:#f5b900;color:#050505;padding:13px 22px;font-weight:1000;font-size:16px}.small{font-size:12px;color:#888;margin-top:14px}.hidden{display:none}.back{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#b6ff00;text-decoration:none;font-weight:800;font-size:12px;z-index:3}
</style>
</head>
<body><div class="wrap"><div class="game"><canvas id="c"></canvas><div class="title">🐕 SPITZ RUN</div><div class="hud"><div class="box">SCORE <span id="score">0</span></div><div class="box">BEST <span id="best">0</span></div></div><div id="start" class="overlay"><div class="panel"><h1>SPITZ RUN</h1><p>Keep SPITZ running. Dodge obstacles falling from above. Move left and right, collect 🦴 and beat your high score.</p><button class="btn" id="play">START RUN</button><div class="small">← → / A D or drag SPITZ left and right</div></div></div><div id="over" class="overlay hidden"><div class="panel"><h1>PACK DOWN!</h1><p>Your score: <b id="final">0</b></p><button class="btn" id="again">RUN AGAIN</button><div class="small">The Pack never gives up.</div></div></div><a class="back" href="../">← BACK TO SPITZ</a></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W,H,dpr,player,obstacles,bones,score,best=+localStorage.spitzBest||0,running=false,last=0,spawn=0,boneSpawn=0,speed=4.5,targetX=0,pointer=false;
bestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.y=H-105;player.x=Math.min(Math.max(player.x,35),W-35)}}
addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H-105,w:62,h:62};obstacles=[];bones=[];score=0;speed=4.5;spawn=650;boneSpawn=900;targetX=player.x;scoreEl.textContent=0}
function start(){reset();running=true;document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function gameOver(){running=false;best=Math.max(best,Math.floor(score));localStorage.spitzBest=best;bestEl.textContent=best;document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.remove('hidden')}
function move(dir){if(!running)return;targetX+=dir*55;targetX=Math.max(38,Math.min(W-38,targetX))}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(e.key==='Enter'&&!running)start()});
function pointerMove(e){const r=canvas.getBoundingClientRect();targetX=Math.max(38,Math.min(W-38,e.clientX-r.left));pointer=true}
canvas.addEventListener('pointerdown',pointerMove);canvas.addEventListener('pointermove',e=>{if(e.buttons)pointerMove(e)});document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2-8&&Math.abs(a.y-b.y)<(a.h+b.h)/2-8}
function update(dt){score+=dt*.014;scoreEl.textContent=Math.floor(score);speed=Math.min(10,speed+dt*.00012);player.x+=(targetX-player.x)*Math.min(1,dt*.012);
spawn-=dt;if(spawn<=0){const size=34+Math.random()*30;obstacles.push({x:size/2+Math.random()*(W-size),y:-size,w:size,h:size,rot:Math.random()*6});spawn=Math.max(320,720-Math.min(350,score*1.2))+Math.random()*420}
boneSpawn-=dt;if(boneSpawn<=0){bones.push({x:25+Math.random()*(W-50),y:-25,w:26,h:26,spin:0});boneSpawn=850+Math.random()*900}
obstacles.forEach(o=>{o.y+=speed*dt/16;o.rot+=dt*.004});bones.forEach(b=>{b.y+=(speed*.82)*dt/16;b.spin+=dt*.006});
for(const o of obstacles)if(hit(player,o)){gameOver();return}for(let i=bones.length-1;i>=0;i--)if(hit(player,bones[i])){score+=100;bones.splice(i,1)}
obstacles=obstacles.filter(o=>o.y<H+70);bones=bones.filter(b=>b.y<H+50)}
function drawDog(){ctx.save();ctx.translate(player.x,player.y);const bob=Math.sin(performance.now()*.018)*2;ctx.translate(0,bob);ctx.fillStyle='#f5b900';ctx.beginPath();ctx.roundRect(-27,-16,43,31,15);ctx.fill();ctx.beginPath();ctx.arc(18,-10,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0b0b0b';ctx.beginPath();ctx.moveTo(-5,-27);ctx.lineTo(5,-39);ctx.lineTo(10,-21);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(24,-14,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(25,-14,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b6ff00';ctx.fillRect(-22,13,11,5);ctx.fillRect(8,13,11,5);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#201500');g.addColorStop(.45,'#0d0d0d');g.addColorStop(1,'#050505');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// vertical running lane
ctx.strokeStyle='#292929';ctx.lineWidth=1;for(let x=0;x<W;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.strokeStyle='#b6ff00';ctx.globalAlpha=.12;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(24,H);ctx.moveTo(W-24,0);ctx.lineTo(W-24,H);ctx.stroke();ctx.globalAlpha=1;
// falling motion marks
ctx.strokeStyle='#f5b900';ctx.globalAlpha=.18;for(let i=0;i<18;i++){let x=(i*83+Math.floor(score*3))%W,y=(i*71+Math.floor(score*9))%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+20+(i%3)*10);ctx.stroke()}ctx.globalAlpha=1;
obstacles.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.fillStyle='#b6ff00';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.fillStyle='#f5b900';ctx.fillRect(-o.w*.3,-o.h*.5,o.w*.6,5);ctx.restore()});
bones.forEach(b=>{ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(b.spin)*.25);ctx.fillStyle='#fff';ctx.fillRect(-9,-3,18,6);ctx.fillRect(-11,-8,6,6);ctx.fillRect(-11,2,6,6);ctx.fillRect(5,-8,6,6);ctx.fillRect(5,2,6,6);ctx.restore()});
drawDog();ctx.fillStyle='#f5b900';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText('DODGE THE DROP',W/2,H-62)}
function loop(t){if(!running)return;const dt=Math.min(32,t-last);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}reset();draw();
</script></body></html>
