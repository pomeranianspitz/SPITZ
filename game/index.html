<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPITZ RUN — THE PACK IS FORMING.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:manipulation}.wrap{height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}.game{width:min(900px,100%);height:min(700px,calc(100vh - 28px));position:relative;border:2px solid #f5b900;border-radius:24px;overflow:hidden;background:linear-gradient(#17120a,#080808 65%)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:14px 16px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-weight:900}.box{background:#080808cc;border:1px solid #b6ff00;border-radius:12px;padding:8px 12px;color:#b6ff00}.title{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#f5b900;font-weight:1000;letter-spacing:.12em;font-size:clamp(16px,3vw,24px);white-space:nowrap}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0009}.panel{padding:28px;border:1px solid #f5b900;border-radius:22px;background:#0b0b0bf2;max-width:430px;margin:18px}.panel h1{margin:0 0 8px;color:#f5b900;font-size:clamp(34px,8vw,58px);line-height:1}.panel p{color:#ccc}.btn{border:0;border-radius:12px;background:#f5b900;color:#050505;padding:13px 22px;font-weight:1000;font-size:16px}.small{font-size:12px;color:#888;margin-top:14px}.hidden{display:none}.back{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#b6ff00;text-decoration:none;font-weight:800;font-size:12px}
</style>
</head>
<body><div class="wrap"><div class="game"><canvas id="c"></canvas><div class="title">🐕 SPITZ RUN</div><div class="hud"><div class="box">SCORE <span id="score">0</span></div><div class="box">BEST <span id="best">0</span></div></div><div id="start" class="overlay"><div class="panel"><h1>SPITZ RUN</h1><p>Run with the Pack. Jump the obstacles. Collect 🦴 and beat your high score.</p><button class="btn" id="play">START RUN</button><div class="small">Tap / click / SPACE to jump</div></div></div><div id="over" class="overlay hidden"><div class="panel"><h1>PACK DOWN!</h1><p>Your score: <b id="final">0</b></p><button class="btn" id="again">RUN AGAIN</button><div class="small">The Pack never gives up.</div></div></div><a class="back" href="../">← BACK TO SPITZ</a></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W,H,dpr,player,obstacles,bones,score,best=+localStorage.spitzBest||0,running=false,last=0,spawn=0,boneSpawn=0,speed=6,ground=0;
bestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H-92;if(player)player.y=ground-player.h}
addEventListener('resize',resize);resize();
function reset(){player={x:70,y:ground-54,w:58,h:54,vy:0,onGround:true};obstacles=[];bones=[];score=0;speed=6;spawn=700;boneSpawn=900;scoreEl.textContent=0}
function jump(){if(!running)return;if(player.onGround){player.vy=-14;player.onGround=false}}
addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}if(e.code==='Enter'&&!running)start()});
canvas.addEventListener('pointerdown',jump);document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
function start(){reset();running=true;document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function gameOver(){running=false;best=Math.max(best,Math.floor(score));localStorage.spitzBest=best;bestEl.textContent=best;document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.remove('hidden')}
function rectHit(a,b){return a.x+8<b.x+b.w&&a.x+a.w-8>b.x&&a.y+8<b.y+b.h&&a.y+a.h-6>b.y}
function update(dt){score+=dt*.012;scoreEl.textContent=Math.floor(score);speed=Math.min(11,speed+dt*.00018);player.vy+=.65*dt/16;player.y+=player.vy*dt/16;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.onGround=true}
spawn-=dt; if(spawn<=0){let h=32+Math.random()*35;obstacles.push({x:W+30,y:ground-h,w:28+Math.random()*22,h});spawn=650+Math.random()*850-speed*35}
boneSpawn-=dt;if(boneSpawn<=0){bones.push({x:W+20,y:ground-80-Math.random()*130,w:24,h:24,spin:0});boneSpawn=900+Math.random()*1100}
obstacles.forEach(o=>o.x-=speed*dt/16);bones.forEach(b=>{b.x-=speed*dt/16;b.spin+=dt*.006});obstacles=obstacles.filter(o=>o.x>-60);bones=bones.filter(b=>b.x>-50);
for(const o of obstacles)if(rectHit(player,o)){gameOver();return}for(let i=bones.length-1;i>=0;i--)if(rectHit(player,bones[i])){score+=100;bones.splice(i,1)} }
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#251900');g.addColorStop(.62,'#0d0d0d');g.addColorStop(1,'#050505');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#151515';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#b6ff00';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();
// background stars
ctx.fillStyle='#f5b900';for(let i=0;i<35;i++){let x=(i*97+Math.floor(score)*2)%W,y=45+(i*53)%Math.max(60,ground-100);ctx.globalAlpha=.25+(i%3)*.12;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
// player
ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#f5b900';ctx.beginPath();ctx.roundRect(8,18,40,29,13);ctx.fill();ctx.beginPath();ctx.arc(47,25,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0b0b0b';ctx.beginPath();ctx.moveTo(35,8);ctx.lineTo(45,1);ctx.lineTo(48,17);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(53,22,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(54,22,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b6ff00';ctx.fillRect(12,45,10,5);ctx.fillRect(37,45,10,5);ctx.restore();
// obstacles
ctx.fillStyle='#b6ff00';obstacles.forEach(o=>{ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#f5b900';ctx.fillRect(o.x+5,o.y+7,o.w-10,5);ctx.fillStyle='#b6ff00'});
// bones
bones.forEach(b=>{ctx.save();ctx.translate(b.x+12,b.y+12);ctx.rotate(Math.sin(b.spin)*.25);ctx.fillStyle='#fff';ctx.fillRect(-8,-3,16,6);ctx.fillRect(-10,-7,6,6);ctx.fillRect(-10,1,6,6);ctx.fillRect(4,-7,6,6);ctx.fillRect(4,1,6,6);ctx.restore()});
}
function loop(t){if(!running)return;let dt=Math.min(32,t-last);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
reset();draw();
</script></body></html>
