<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPITZ DODGE — THE PACK IS FORMING.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;color:#fff}.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:10px}.game{position:relative;width:min(720px,100%);height:min(900px,calc(100vh - 20px));overflow:hidden;border:2px solid #f5b900;border-radius:24px;background:#070707;box-shadow:0 0 40px #000}.game:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 60%,#0009)}canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:4;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#080808dd;border:1px solid #b6ff00;border-radius:12px;padding:8px 12px;font-weight:900;color:#b6ff00}.title{position:absolute;z-index:4;top:16px;left:50%;transform:translateX(-50%);font-size:clamp(16px,4vw,24px);font-weight:1000;letter-spacing:.12em;color:#f5b900;white-space:nowrap}.overlay{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000b}.panel{width:min(430px,90%);padding:28px 22px;border:1px solid #f5b900;border-radius:22px;background:#0b0b0bf5}.panel h1{margin:0 0 8px;font-size:clamp(40px,10vw,64px);line-height:1;color:#f5b900}.panel p{color:#ccc;line-height:1.5}.btn{border:0;border-radius:14px;background:#f5b900;color:#050505;padding:14px 25px;font-size:17px;font-weight:1000;cursor:pointer}.small{margin-top:14px;font-size:12px;color:#888}.hidden{display:none}.back{position:absolute;z-index:5;bottom:10px;left:50%;transform:translateX(-50%);color:#b6ff00;text-decoration:none;font-size:12px;font-weight:800}
</style>
</head>
<body><div class="wrap"><div class="game"><canvas id="c"></canvas><div class="title">🐕 SPITZ DODGE</div><div class="hud"><div class="box">SCORE <span id="score">0</span></div><div class="box">BEST <span id="best">0</span></div></div><div id="start" class="overlay"><div class="panel"><h1>SPITZ DODGE</h1><p>Keep SPITZ running! Dodge the obstacles, collect bones and beat your high score.</p><button class="btn" id="play">START RUN</button><div class="small">Drag left or right to move • Arrow keys on desktop</div></div></div><div id="over" class="overlay hidden"><div class="panel"><h1>PACK DOWN!</h1><p>Your score: <b id="final">0</b></p><button class="btn" id="again">PLAY AGAIN</button><div class="small">One more run. Beat your record!</div></div></div><a class="back" href="../">← BACK TO SPITZ</a></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let W,H,dpr,run=false,last=0,score=0,best=+localStorage.spitzDodgeBest||0,player,lane=1,targetLane=1,items=[],spawn=0,speed=0.22,shake=0,audio=null;
bestEl.textContent=best;
function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function beep(freq,dur=.08,type='sine',vol=.035){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}
function start(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();score=0;lane=1;targetLane=1;items=[];spawn=650;speed=.22;shake=0;run=true;scoreEl.textContent=0;document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');beep(520,.1,'square',.05);last=performance.now();requestAnimationFrame(loop)}
function gameOver(){run=false;best=Math.max(best,Math.floor(score));localStorage.spitzDodgeBest=best;bestEl.textContent=best;document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.remove('hidden');beep(110,.3,'sawtooth',.05)}
function move(d){if(!run)return;targetLane=Math.max(0,Math.min(2,targetLane+d));beep(d<0?330:440,.045,'square',.025)}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();move(1)}if(e.key==='Enter'&&!run)start()});
let sx=0; c.addEventListener('pointerdown',e=>sx=e.clientX);c.addEventListener('pointerup',e=>{let dx=e.clientX-sx;if(Math.abs(dx)>18)move(dx<0?-1:1)});document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
function laneX(l,depth){let center=W/2;let spread=Math.min(W*.34,240);let perspective=.18+.82*depth;return center+(l-1)*spread*perspective}
function resetItem(kind){let l=Math.floor(Math.random()*3);items.push({kind,l,z:0.02,size:kind==='bone'?18:28,spin:Math.random()*6})}
function update(dt){score+=dt*.012;scoreEl.textContent=Math.floor(score);speed=Math.min(.62,speed+dt*.000012);player={x:laneX(targetLane,1),y:H*.82};if(lane!==targetLane&&Math.abs(lane-targetLane)>0){lane=targetLane}
spawn-=dt;if(spawn<=0){resetItem('rock');if(Math.random()<.35)resetItem('bone');spawn=Math.max(380,780-score*.7)+Math.random()*280}
items.forEach(o=>{o.z+=speed*dt/16;o.spin+=dt*.004});for(let i=items.length-1;i>=0;i--){let o=items[i],px=laneX(o.l,1),py=H*.82,ox=laneX(o.l,o.z),oy=H*.08+(H*.78)*o.z;if(o.z>.86&&o.l===targetLane&&Math.abs(oy-py)<55){if(o.kind==='bone'){score+=100;items.splice(i,1);beep(880,.08,'triangle',.04)}else{shake=12;gameOver();return}}else if(o.z>1.08)items.splice(i,1)}shake*=.88}
function drawDog(px,py,s){x.save();x.translate(px,py);let bob=Math.sin(performance.now()*.018)*3;x.translate(0,bob);x.scale(s,s);x.fillStyle='#f5b900';x.beginPath();x.ellipse(-7,0,32,22,0,0,Math.PI*2);x.fill();x.beginPath();x.arc(25,-8,19,0,Math.PI*2);x.fill();x.fillStyle='#8a6100';x.beginPath();x.moveTo(12,-23);x.lineTo(4,-43);x.lineTo(20,-28);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(30,-12,5,0,Math.PI*2);x.fill();x.fillStyle='#050505';x.beginPath();x.arc(31,-12,2.5,0,Math.PI*2);x.fill();x.fillStyle='#050505';x.beginPath();x.arc(43,-4,4,0,Math.PI*2);x.fill();x.strokeStyle='#b6ff00';x.lineWidth=5;x.beginPath();x.moveTo(-24,17);x.lineTo(-34,29);x.moveTo(8,18);x.lineTo(2,30);x.moveTo(27,10);x.lineTo(32,22);x.stroke();x.restore()}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171000');g.addColorStop(.45,'#0b0b0b');g.addColorStop(1,'#030303');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
// perspective road
x.fillStyle='#101010';x.beginPath();x.moveTo(W*.35,0);x.lineTo(W*.65,0);x.lineTo(W*.94,H);x.lineTo(W*.06,H);x.closePath();x.fill();x.strokeStyle='#b6ff00';x.globalAlpha=.22;x.lineWidth=2;x.beginPath();x.moveTo(W*.35,0);x.lineTo(W*.06,H);x.moveTo(W*.65,0);x.lineTo(W*.94,H);x.stroke();x.globalAlpha=1;
// lane lines with moving dashes
for(let l=0;l<2;l++){for(let j=0;j<9;j++){let z=((j/9)+(score*.0008))%1;let yy=H*.08+H*.78*z;let xx=laneX(l,z);let half=Math.max(2,10*z);x.strokeStyle='#555';x.lineWidth=Math.max(1,3*z);x.beginPath();x.moveTo(xx-half,yy);x.lineTo(xx+half,yy);x.stroke()}}
items.forEach(o=>{let xx=laneX(o.l,o.z),yy=H*.08+H*.78*o.z,s=o.size*(.3+1.7*o.z);x.save();x.translate(xx,yy);x.rotate(o.spin);if(o.kind==='bone'){x.fillStyle='#fff';x.fillRect(-s*.55,-s*.14,s*1.1,s*.28);x.fillRect(-s*.62,-s*.42,s*.3,s*.3);x.fillRect(-s*.62,s*.12,s*.3,s*.3);x.fillRect(s*.32,-s*.42,s*.3,s*.3);x.fillRect(s*.32,s*.12,s*.3,s*.3)}else{x.fillStyle='#b6ff00';x.beginPath();x.roundRect(-s/2,-s/2,s,s*.85,7);x.fill();x.fillStyle='#f5b900';x.fillRect(-s*.28,-s*.43,s*.56,s*.1)}x.restore()});
drawDog(player.x,player.y,1);x.fillStyle='#f5b900';x.font='900 12px system-ui';x.textAlign='center';x.fillText('DODGE • COLLECT • BEAT YOUR BEST',W/2,H-32);x.restore()}
function loop(t){if(!run)return;let dt=Math.min(32,t-last);last=t;update(dt);draw();if(run)requestAnimationFrame(loop)}
player={x:W/2,y:H*.82};draw();
</script></body></html>
