<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPITZ RUN — THE PACK IS FORMING.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}.game{position:relative;width:min(900px,100%);height:min(760px,calc(100vh - 24px));overflow:hidden;border:2px solid #f5b900;border-radius:24px;background:#070707;box-shadow:0 0 45px #000}.game canvas{width:100%;height:100%;display:block}.title{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:3;color:#f5b900;font-weight:1000;letter-spacing:.12em;font-size:clamp(15px,3vw,24px);white-space:nowrap;text-shadow:0 2px 8px #000}.hud{position:absolute;top:15px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}.box{background:#050505dd;border:1px solid #b6ff00;border-radius:11px;padding:7px 11px;color:#b6ff00;font-weight:900}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:#000b}.panel{max-width:440px;margin:18px;padding:28px;border:1px solid #f5b900;border-radius:22px;background:#090909f7}.panel h1{margin:0 0 10px;color:#f5b900;font-size:clamp(38px,9vw,62px);line-height:1}.panel p{color:#ccc;line-height:1.5}.btn{border:0;border-radius:12px;background:#f5b900;color:#050505;padding:13px 23px;font-weight:1000;font-size:16px}.small{margin-top:14px;color:#888;font-size:12px}.hidden{display:none}.back{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;color:#b6ff00;text-decoration:none;font-weight:800;font-size:12px}
</style>
</head>
<body><div class="wrap"><div class="game"><canvas id="c"></canvas><div class="title">🐕 SPITZ RUN</div><div class="hud"><div class="box">SCORE <span id="score">0</span></div><div class="box">BEST <span id="best">0</span></div></div><div id="start" class="overlay"><div class="panel"><h1>SPITZ RUN</h1><p>Run into the distance. Dodge obstacles coming toward SPITZ, switch lanes and collect bones.</p><button class="btn" id="play">START RUN</button><div class="small">← → / A D or drag left and right</div></div></div><div id="over" class="overlay hidden"><div class="panel"><h1>PACK DOWN!</h1><p>Your score: <b id="final">0</b></p><button class="btn" id="again">RUN AGAIN</button><div class="small">The Pack never gives up.</div></div></div><a class="back" href="../">← BACK TO SPITZ</a></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W,H,dpr,player,objects,score,best=+localStorage.spitzBest||0,running=false,last=0,spawn=0,speed=0.34,laneTarget=1,pointerX=null;
bestEl.textContent=best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){player={lane:1,x:W/2};objects=[];score=0;speed=.34;laneTarget=1;spawn=.8;scoreEl.textContent=0}
function start(){reset();running=true;document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function gameOver(){running=false;best=Math.max(best,Math.floor(score));localStorage.spitzBest=best;bestEl.textContent=best;document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.remove('hidden')}
function setLane(n){if(!running)return;laneTarget=Math.max(0,Math.min(2,n))}
function move(dir){setLane(laneTarget+dir)}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();move(1)}if(e.key==='Enter'&&!running)start()});
function laneX(l,z){const horizonY=H*.24,bottomY=H*.94,center=W/2;const spread=14+(W*.46-14)*z;return center+(l-1)*spread}
function worldY(z){return H*.24+(H*.70)*Math.pow(z,1.65)}
function sizeAt(z,base){return base*(.22+1.9*z)}
function pointer(e){const r=canvas.getBoundingClientRect();const x=e.clientX-r.left;if(x<W/3)setLane(0);else if(x<W*2/3)setLane(1);else setLane(2);pointerX=x}
canvas.addEventListener('pointerdown',pointer);canvas.addEventListener('pointermove',e=>{if(e.buttons)pointer(e)});
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
function spawnObject(){const lane=Math.floor(Math.random()*3);const type=Math.random()<.78?'rock':'bone';objects.push({lane,z:.03,type,spin:Math.random()*6});spawn=Math.max(.34,1.05-score*.0007)+Math.random()*.55}
function update(dt){const sec=dt/1000;score+=sec*13;scoreEl.textContent=Math.floor(score);speed=Math.min(.68,speed+sec*.004);player.lane+=(laneTarget-player.lane)*Math.min(1,sec*11);spawn-=sec;if(spawn<=0)spawnObject();for(const o of objects){o.z+=speed*sec;o.spin+=sec*4}for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(o.z>.83&&o.z<1.02&&Math.abs(o.lane-player.lane)<.34){if(o.type==='bone'){score+=125;objects.splice(i,1)}else{gameOver();return}}if(o.z>1.15)objects.splice(i,1)}}
function drawBackground(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#241800');sky.addColorStop(.30,'#101010');sky.addColorStop(1,'#050505');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant glow
ctx.fillStyle='#f5b900';ctx.globalAlpha=.12;ctx.beginPath();ctx.arc(W/2,H*.25,Math.min(W,H)*.13,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// road / perspective
const hy=H*.24,by=H*.98,c=W/2;ctx.fillStyle='#0c0c0c';ctx.beginPath();ctx.moveTo(c-W*.08,hy);ctx.lineTo(c+W*.08,hy);ctx.lineTo(c+W*.48,by);ctx.lineTo(c-W*.48,by);ctx.closePath();ctx.fill();
// road edges
ctx.strokeStyle='#b6ff00';ctx.globalAlpha=.55;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c-W*.08,hy);ctx.lineTo(c-W*.48,by);ctx.moveTo(c+W*.08,hy);ctx.lineTo(c+W*.48,by);ctx.stroke();ctx.globalAlpha=1;
// lane markings moving into the distance
for(let lane=0;lane<2;lane++){const bottom=c+(lane-.5)*W*.32;ctx.strokeStyle='#333';ctx.lineWidth=2;for(let i=0;i<9;i++){let z=(i/9+(performance.now()*.00018*speed*3))%1;let y=worldY(z);let x=c+(lane-.5)*(14+(W*.46-14)*z);let half=3+12*z;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+half);ctx.stroke()}}
// speed streaks
ctx.strokeStyle='#f5b900';ctx.globalAlpha=.14;for(let i=0;i<18;i++){let z=(i/18+(performance.now()*.00035*speed*3))%1;let y=worldY(z);let x=c+(Math.sin(i*7.3)*.8)*(W*.44*z);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+8+35*z);ctx.stroke()}ctx.globalAlpha=1}
function drawObject(o){const x=laneX(o.lane,o.z),y=worldY(o.z),s=sizeAt(o.z,o.type==='bone'?22:28);ctx.save();ctx.translate(x,y);if(o.type==='bone'){ctx.rotate(Math.sin(o.spin)*.4);ctx.fillStyle='#fff';ctx.fillRect(-s*.42,-s*.10,s*.84,s*.20);ctx.fillRect(-s*.50,-s*.34,s*.28,s*.28);ctx.fillRect(-s*.50,s*.06,s*.28,s*.28);ctx.fillRect(s*.22,-s*.34,s*.28,s*.28);ctx.fillRect(s*.22,s*.06,s*.28,s*.28)}else{ctx.rotate(o.spin*.2);ctx.fillStyle='#b6ff00';ctx.beginPath();ctx.roundRect(-s/2,-s/2,s,s*.86,7);ctx.fill();ctx.fillStyle='#f5b900';ctx.fillRect(-s*.28,-s*.43,s*.56,s*.10)}ctx.restore()}
function drawDog(){const x=laneX(player.lane,.91),y=H*.86;const bob=Math.sin(performance.now()*.015)*3;ctx.save();ctx.translate(x,y+bob);const s=Math.min(W,H)*.085;ctx.scale(s/60,s/60);
// shadow
ctx.fillStyle='#000';ctx.globalAlpha=.5;ctx.beginPath();ctx.ellipse(0,27,31,8,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// legs running
const step=Math.sin(performance.now()*.025)*7;ctx.strokeStyle='#b6ff00';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-13,15);ctx.lineTo(-18,29+step);ctx.moveTo(10,15);ctx.lineTo(16,29-step);ctx.stroke();
// body
ctx.fillStyle='#f5b900';ctx.beginPath();ctx.roundRect(-28,-15,45,31,15);ctx.fill();
// tail
ctx.strokeStyle='#f5b900';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-24,-7);ctx.quadraticCurveTo(-38,-23,-31,-31);ctx.stroke();
// head + ears
ctx.fillStyle='#f5b900';ctx.beginPath();ctx.arc(19,-11,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0b0b0b';ctx.beginPath();ctx.moveTo(5,-25);ctx.lineTo(3,-42);ctx.lineTo(14,-29);ctx.fill();ctx.beginPath();ctx.moveTo(27,-25);ctx.lineTo(35,-39);ctx.lineTo(37,-18);ctx.fill();
// face
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(24,-15,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(25,-15,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(34,-9,3,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);drawBackground();objects.sort((a,b)=>a.z-b.z);objects.forEach(drawObject);drawDog();ctx.fillStyle='#b6ff00';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText('DODGE • COLLECT • RUN',W/2,H-27)}
function loop(t){if(!running)return;const dt=Math.min(40,t-last);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
reset();draw();
</script></body></html>
